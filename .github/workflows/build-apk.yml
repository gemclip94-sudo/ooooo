      package com.example.melodypulse.model

      import android.net.Uri

      data class Song(
          val id: Long,
          val title: String,
          val artist: String,
          val album: String,
          val duration: Long,
          val uri: Uri,
          val albumArtUri: Uri?
      )

  - path: "app/src/main/java/com/example/melodypulse/data/MusicRepository.kt"
    content: |
      package com.example.melodypulse.data

      import android.content.ContentUris
      import android.content.Context
      import android.net.Uri
      import android.provider.MediaStore
      import com.example.melodypulse.model.Song
      import kotlinx.coroutines.Dispatchers
      import kotlinx.coroutines.withContext

      class MusicRepository(private val context: Context) {

          suspend fun fetchDeviceSongs(): List<Song> = withContext(Dispatchers.IO) {
              val songList = mutableListOf<Song>()
              val collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI

              val projection = arrayOf(
                  MediaStore.Audio.Media._ID,
                  MediaStore.Audio.Media.TITLE,
                  MediaStore.Audio.Media.ARTIST,
                  MediaStore.Audio.Media.ALBUM,
                  MediaStore.Audio.Media.DURATION,
                  MediaStore.Audio.Media.ALBUM_ID
              )

              val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"
              val sortOrder = "${MediaStore.Audio.Media.TITLE} ASC"

              context.contentResolver.query(
                  collection,
                  projection,
                  selection,
                  null,
                  sortOrder
              )?.use { cursor ->
                  val idColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                  val titleColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                  val artistColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                  val albumColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                  val durationColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                  val albumIdColumn = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)

                  while (cursor.moveToNext()) {
                      val id = cursor.getLong(idColumn)
                      val title = cursor.getString(titleColumn) ?: "Unknown Title"
                      val artist = cursor.getString(artistColumn) ?: "Unknown Artist"
                      val album = cursor.getString(albumColumn) ?: "Unknown Album"
                      val duration = cursor.getLong(durationColumn)
                      
                      if (duration < 30000) continue

                      val contentUri = ContentUris.withAppendedId(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          id
                      )
                      
                      val albumId = cursor.getLong(albumIdColumn)
                      val albumArtUri = ContentUris.withAppendedId(
                          Uri.parse("content://media/external/audio/albumart"),
                          albumId
                      )

                      songList.add(
                          Song(
                              id = id,
                              title = title,
                              artist = artist,
                              album = album,
                              duration = duration,
                              uri = contentUri,
                              albumArtUri = albumArtUri
                          )
                      )
                  }
              }
              songList
          }
      }

