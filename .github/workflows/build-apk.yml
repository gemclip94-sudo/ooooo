  - path: "README.md"
    content: |
      # MelodyPulse 🎶

      MelodyPulse is a modern, fully functional local music player Android application built with **Jetpack Compose**, **Material 3**, and **AndroidX Media3 (ExoPlayer)**. It features an immersive Cyberpunk Neon Dark theme.

      ## Features
      - **Local Audio Scanning:** Automatically detects and indexes local music files on your device using `MediaStore` (compatible with Android 10 up to Android 14+).
      - **ExoPlayer Integration:** Smooth audio streaming and robust background playback.
      - **Cyberpunk UI Theme:** Deep dark backgrounds with glowing neon purple and electric cyan highlights.
      - **Interactive Controls:** Includes a mini-player bottom bar, full-screen player view with animated vinyl disc styling, and time scrubbing.

      ## Tech Stack
      - **Kotlin** & **Jetpack Compose**
      - **Material 3**
      - **AndroidX Media3 (ExoPlayer)**

