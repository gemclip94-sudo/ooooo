  - path: "app/src/main/java/com/example/melodypulse/MainActivity.kt"
    content: |
      package com.example.melodypulse

      import android.Manifest
      import android.content.pm.PackageManager
      import android.os.Build
      import android.os.Bundle
      import androidx.activity.ComponentActivity
      import androidx.activity.compose.setContent
      import androidx.activity.result.contract.ActivityResultContracts
      import androidx.compose.foundation.background
      import androidx.compose.foundation.clickable
      import androidx.compose.foundation.layout.*
      import androidx.compose.foundation.lazy.LazyColumn
      import androidx.compose.foundation.lazy.itemsIndexed
      import androidx.compose.foundation.shape.CircleShape
      import androidx.compose.foundation.shape.RoundedCornerShape
      import androidx.compose.material.icons.Icons
      import androidx.compose.material.icons.filled.*
      import androidx.compose.material3.*
      import androidx.compose.runtime.*
      import androidx.compose.ui.Alignment
      import androidx.compose.ui.Modifier
      import androidx.compose.ui.draw.clip
      import androidx.compose.ui.graphics.Brush
      import androidx.compose.ui.graphics.Color
      import androidx.compose.ui.platform.ContextCompat
      import androidx.compose.ui.text.font.FontWeight
      import androidx.compose.ui.text.style.TextOverflow
      import androidx.compose.ui.unit.dp
      import androidx.compose.ui.unit.sp
      import androidx.media3.common.MediaItem
      import androidx.media3.common.Player
      import androidx.media3.exoplayer.ExoPlayer
      import com.example.melodypulse.data.MusicRepository
      import com.example.melodypulse.model.Song
      import com.example.melodypulse.ui.theme.MelodyPulseTheme
      import kotlinx.coroutines.delay
      import kotlinx.coroutines.launch

      class MainActivity : ComponentActivity() {

          private lateinit var exoPlayer: ExoPlayer
          private val musicRepository by lazy { MusicRepository(this) }

          private var _songs = mutableStateOf<List<Song>>(emptyList())
          val songs: State<List<Song>> = _songs

          private val permissionLauncher = registerForActivityResult(
              ActivityResultContracts.RequestPermission()
          ) { isGranted ->
              if (isGranted) {
                  loadMusic()
              }
          }

          override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              exoPlayer = ExoPlayer.Builder(this).build()

              checkAndRequestPermission()

              setContent {
                  MelodyPulseTheme {
                      Surface(
                          modifier = Modifier.fillMaxSize(),
                          color = MaterialTheme.colorScheme.background
                      ) {
                          MainScreen(exoPlayer = exoPlayer, songs = songs.value) {
                              checkAndRequestPermission()
                          }
                      }
                  }
              }
          }

          private fun checkAndRequestPermission() {
              val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                  Manifest.permission.READ_MEDIA_AUDIO
              } else {
                  Manifest.permission.READ_EXTERNAL_STORAGE
              }

              when {
                  ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED -> {
                      loadMusic()
                  }
                  else -> {
                      permissionLauncher.launch(permission)
                  }
              }
          }

          private fun loadMusic() {
              val scope = kotlinx.coroutines.CoroutineScope(kotlinx.coroutines.Dispatchers.Main)
              scope.launch {
                  _songs.value = musicRepository.fetchDeviceSongs()
              }
          }

          override fun onDestroy() {
              super.onDestroy()
              exoPlayer.release()
          }
      }

      @OptIn(ExperimentalMaterial3Api::class)
      @Composable
      fun MainScreen(exoPlayer: ExoPlayer, songs: List<Song>, onRequestPermission: () -> Unit) {
          var currentSongIndex by remember { mutableStateOf<Int?>(null) }
          var isPlaying by remember { mutableStateOf(false) }
          var currentPosition by remember { mutableStateOf(0L) }
          var totalDuration by remember { mutableStateOf(0L) }
          var showFullPlayer by remember { mutableStateOf(false) }

          DisposableEffect(exoPlayer) {
              val listener = object : Player.Listener {
                  override fun onIsPlayingChanged(playing: Boolean) {
                      isPlaying = playing
                  }
                  override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                      currentSongIndex = exoPlayer.currentMediaItemIndex
                  }
              }
              exoPlayer.addListener(listener)
              onDispose { exoPlayer.removeListener(listener) }
          }

          LaunchedEffect(isPlaying) {
              while (isPlaying) {
                  currentPosition = exoPlayer.currentPosition
                  totalDuration = exoPlayer.duration.coerceAtLeast(0L)
                  delay(500)
              }
          }

          fun playSong(index: Int) {
              if (songs.isEmpty()) return
              currentSongIndex = index
              val song = songs[index]
              exoPlayer.setMediaItem(MediaItem.fromUri(song.uri))
              exoPlayer.prepare()
              exoPlayer.play()
          }

          Scaffold(
              topBar = {
                  TopAppBar(
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Box(
                                  modifier = Modifier
                                      .size(10.dp)
                                      .clip(CircleShape)
                                      .background(MaterialTheme.colorScheme.secondary)
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              Text("MelodyPulse", fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
                          }
                      },
                      actions = {
                          IconButton(onClick = onRequestPermission) {
                              Icon(Icons.Default.Refresh, contentDescription = "Scan Music")
                          }
                      },
                      colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)
                  )
              },
              bottomBar = {
                  if (currentSongIndex != null && songs.isNotEmpty()) {
                      val activeSong = songs[currentSongIndex!!]
                      MiniPlayerBar(
                          song = activeSong,
                          isPlaying = isPlaying,
                          onPlayPauseToggle = {
                              if (exoPlayer.isPlaying) exoPlayer.pause() else exoPlayer.play()
                          },
                          onOpenPlayer = { showFullPlayer = true }
                      )
                  }
              }
          ) { innerPadding ->
              Box(modifier = Modifier.padding(innerPadding).fillMaxSize()) {
                  if (songs.isEmpty()) {
                      Column(
                          modifier = Modifier.fillMaxSize().padding(32.dp),
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Icon(
                              Icons.Default.MusicNote,
                              contentDescription = null,
                              modifier = Modifier.size(64.dp),
                              tint = MaterialTheme.colorScheme.secondary
                          )
                          Spacer(modifier = Modifier.height(16.dp))
                          Text("No local music found or permission needed.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Spacer(modifier = Modifier.height(16.dp))
                          Button(onClick = onRequestPermission, colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)) {
                              Text("Grant Permission / Rescan")
                          }
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(vertical = 12.dp)
                      ) {
                          itemsIndexed(songs) { index, song ->
                              SongListItem(
                                  song = song,
                                  isSelected = currentSongIndex == index,
                                  onClick = { playSong(index) }
                              )
                          }
                      }
                  }

                  if (showFullPlayer && currentSongIndex != null) {
                      FullPlayerScreen(
                          song = songs[currentSongIndex!!],
                          isPlaying = isPlaying,
                          currentPosition = currentPosition,
                          totalDuration = totalDuration,
                          onPlayPause = {
                              if (exoPlayer.isPlaying) exoPlayer.pause() else exoPlayer.play()
                          },
                          onNext = {
                              if (currentSongIndex!! < songs.size - 1) playSong(currentSongIndex!! + 1)
                          },
                          onPrevious = {
                              if (currentSongIndex!! > 0) playSong(currentSongIndex!! - 1)
                          },
                          onSeek = { position ->
                              exoPlayer.seekTo(position)
                          },
                          onClose = { showFullPlayer = false }
                      )
                  }
              }
          }
      }

      @Composable
      fun SongListItem(song: Song, isSelected: Boolean, onClick: () -> Unit) {
          val backgroundColor = if (isSelected) MaterialTheme.colorScheme.surfaceVariant else Color.Transparent
          val textColor = if (isSelected) MaterialTheme.colorScheme.secondary else MaterialTheme.colorScheme.onSurface

          Row(
              modifier = Modifier
                  .fillMaxWidth()
                  .clickable(onClick = onClick)
                  .background(backgroundColor)
                  .padding(horizontal = 16.dp, vertical = 12.dp),
              verticalAlignment = Alignment.CenterVertically
          ) {
              Box(
                  modifier = Modifier
                      .size(48.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(Brush.linearGradient(listOf(MaterialTheme.colorScheme.primary, MaterialTheme.colorScheme.secondary))),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(Icons.Default.MusicNote, contentDescription = null, tint = Color.Black)
              }
              Spacer(modifier = Modifier.width(16.dp))
              Column(modifier = Modifier.weight(1f)) {
                  Text(
                      text = song.title,
                      color = textColor,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      fontSize = 16.sp
                  )
                  Spacer(modifier = Modifier.height
